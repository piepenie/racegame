<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#17312a;background:#f5f8f6}
    header{padding:16px;background:white;border-bottom:1px solid #dce6e0}h1{font-size:21px;margin:0 0 12px}
    .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;padding:9px;border:1px solid #b8ccc1;border-radius:7px}
    button{background:#14664b;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{font-size:14px}
    #zscode{width:130px}
    #message{margin:10px 0 0;font-size:14px;white-space:pre-line}main{display:grid;grid-template-columns:320px 1fr;height:calc(100dvh - 215px);min-height:400px}
    #list{overflow:auto;padding:12px}#map{min-height:400px}.card{display:block;width:100%;text-align:left;background:white;color:#17312a;margin-bottom:8px;line-height:1.6;white-space:pre-line}
    footer{padding:8px 16px;font-size:12px}.leaflet-popup-content{max-height:320px;overflow:auto;line-height:1.6}.charger{border-top:1px solid #ddd;margin-top:8px;padding-top:8px}
    @media(max-width:700px){main{display:flex;flex-direction:column-reverse;height:auto}#map{height:55dvh}#list{max-height:300px}input[type=search]{width:100%}}
  </style>
</head>
<body>
  <header>
    <h1>⚡ 전기차 충전소 지도</h1>
    <div class="controls">
      <label>시·도 <select id="region"></select></label>
      <label>시군구 <select id="gu"></select></label>
      <input id="zscode" inputmode="numeric" maxlength="5" placeholder="코드 5자리 예: 41135" hidden aria-label="시군구 코드">
      <button id="load">조회</button>
      <button id="more" disabled>다음 5,000건</button>
      <span id="spinner" hidden>⏳</span>
      <input id="query" type="search" placeholder="불러온 충전소 이름·주소 검색" aria-label="충전소 이름·주소 검색">
      <label><input id="available" type="checkbox"> 충전대기 있는 곳만</label>
    </div>
    <p id="message" role="status" aria-live="polite">준비 중…</p>
  </header>
  <main><aside id="list" aria-label="충전소 목록"></aside><div id="map" aria-label="충전소 지도"></div></main>
  <footer>충전소 데이터: 한국환경공단 · 공공데이터포털 / 초록: 충전대기 있음, 주황: 충전중만, 회색: 그 외.<br>
    상태는 제공기관 보고값이며 실제 이용 가능 여부와 다를 수 있습니다. 팝업의 상태 갱신 시각·이용 제한을 확인하세요.</footer>
  <script>
    const $ = id => document.getElementById(id);

    // ---------- 코드표 ----------
    const regions = [['11','서울'],['12','전남광주통합특별시'],['26','부산'],['27','대구'],['28','인천'],
      ['30','대전'],['31','울산'],['36','세종'],['41','경기'],['43','충북'],['44','충남'],
      ['47','경북'],['48','경남'],['50','제주'],['51','강원'],['52','전북'],
      ['29','광주 (이전 코드)'],['46','전남 (이전 코드)'],['42','강원 (이전 코드)'],['45','전북 (이전 코드)']];
    const SEOUL_GU = [['11680','강남구'],['11740','강동구'],['11305','강북구'],['11500','강서구'],['11620','관악구'],
      ['11215','광진구'],['11530','구로구'],['11545','금천구'],['11350','노원구'],['11320','도봉구'],
      ['11230','동대문구'],['11590','동작구'],['11440','마포구'],['11410','서대문구'],['11650','서초구'],
      ['11200','성동구'],['11290','성북구'],['11710','송파구'],['11470','양천구'],['11560','영등포구'],
      ['11170','용산구'],['11380','은평구'],['11110','종로구'],['11140','중구'],['11260','중랑구']];
    const states = {'0':'알 수 없음','1':'통신이상','2':'충전대기','3':'충전중','4':'운영중지','5':'점검중','6':'예약중','9':'상태미확인'};
    const types = {'01':'DC차데모','02':'AC완속','03':'DC차데모+AC3상','04':'DC콤보',
      '05':'DC차데모+DC콤보','06':'DC차데모+AC3상+DC콤보','07':'AC3상','08':'DC콤보(완속)',
      '09':'NACS','10':'DC콤보+NACS','11':'DC콤보2(버스전용)'};
    const AUTO_MAX_CALLS = 10; // 시군구를 골랐을 때 자동으로 이어 받을 최대 횟수 (5,000건 × 10)
    const MAX_MARKERS = 3000;  // 지도에 찍을 최대 충전소 수
    const MAX_CARDS = 300;     // 왼쪽 목록에 보여줄 최대 개수

    // ---------- 상태 ----------
    // stations: 충전소ID → {nm, addr, lat, lng, ..., chargers: Map(충전기ID → [ID,타입,상태,갱신,출력,전력])}
    let map, layer, stations = new Map();
    let nextPage = 1, total = 0, loaded = 0, skipped = 0, hasMore = false, busy = false;
    let fetchedAt = null, lastTiming = '', autoCalls = 0;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const time = v => /^\d{14}$/.test(v) ? v.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1-$2-$3 $4:$5:$6') : (v || '정보 없음');

    // ---------- 시군구 목록 채우기 ----------
    function fillGu() {
      const gu = $('gu'); gu.replaceChildren();
      if ($('region').value === '11') SEOUL_GU.forEach(([v, t]) => gu.add(new Option(t, v)));
      gu.add(new Option('시·도 전체 (느림)', ''));
      gu.add(new Option('코드 직접 입력…', 'custom'));
      $('zscode').hidden = true;
    }
    const currentZscode = () => $('gu').value === 'custom' ? $('zscode').value.trim() : $('gu').value;

    function setBusy(v) {
      busy = v;
      ['load', 'region', 'gu', 'zscode'].forEach(id => $(id).disabled = v);
      $('more').disabled = v || !hasMore;
      $('spinner').hidden = !v;
    }

    // ---------- 서버(Code.gs)에서 받아오기 ----------
    function fetchBatch(reset) {
      if (busy) return;
      const zscode = currentZscode();
      if ($('gu').value === 'custom' && !/^\d{5}$/.test(zscode)) {
        $('message').textContent = '시군구 코드는 숫자 5자리로 입력하세요. (예: 41135)'; return;
      }
      if (reset) {
        stations.clear(); nextPage = 1; total = 0; loaded = 0; skipped = 0; hasMore = false;
        fetchedAt = null; autoCalls = 0; layer.clearLayers(); $('list').replaceChildren();
      }
      const clickedAt = Date.now();
      setBusy(true);
      $('message').textContent = (loaded ? `이어서 불러오는 중… (${loaded.toLocaleString()}건 받음)` : '불러오는 중…') +
        (zscode ? '' : '\n시·도 전체는 건수가 많아 느립니다. 시군구를 고르면 훨씬 빨라요.');

      google.script.run.withSuccessHandler(result => {
        const sec = ((Date.now() - clickedAt) / 1000).toFixed(1);
        lastTiming = result.fromCache
          ? `캐시에서 즉시 응답 (${sec}초)`
          : `${result.startPage}~${result.endPage}페이지: 공공데이터 서버 ${(result.apiMs / 1000).toFixed(1)}초 / 전체 ${sec}초`;
        merge(result.stations);
        total = result.totalCount; loaded += result.rawCount; skipped += result.skipped;
        hasMore = result.hasMore; nextPage = result.endPage + 1; fetchedAt = result.fetchedAt;
        setBusy(false);
        render(result.startPage === 1);
        // 시군구를 골랐으면 건수가 적으니 남은 것도 자동으로 이어 받음
        if (zscode && hasMore && ++autoCalls < AUTO_MAX_CALLS) fetchBatch(false);
      }).withFailureHandler(error => {
        setBusy(false);
        $('message').textContent = '조회 실패: ' + (error.message || '잠시 후 다시 시도하세요.') +
          (loaded ? '\n[다음 5,000건] 버튼으로 실패한 부분부터 다시 시도할 수 있습니다.' : '');
      }).getChargers($('region').value, zscode, nextPage);
    }

    // 새로 받은 충전소를 기존 목록에 합치기 (페이지 경계에서 같은 충전소가 나뉘어 올 수 있음)
    function merge(list) {
      for (const s of list) {
        const old = stations.get(s.id);
        if (old) { s.ch.forEach(c => old.chargers.set(c[0], c)); continue; }
        s.chargers = new Map(s.ch.map(c => [c[0], c]));
        delete s.ch;
        stations.set(s.id, s);
      }
    }

    // ---------- 지도·목록 그리기 ----------
    function popupHtml(s, ch, waiting) {
      return `<strong>${esc(s.nm || '이름 없음')}</strong><br>${esc(s.addr)}<br>` +
        (s.loc ? `위치: ${esc(s.loc)}<br>` : '') +
        `충전대기 ${waiting} / 불러온 충전기 ${ch.length}대<br>` +
        `운영: ${esc(s.busi || '정보 없음')} ${esc(s.call)}<br>이용시간: ${esc(s.use || '정보 없음')}<br>` +
        `무료주차: ${s.park === 'Y' ? '예' : s.park === 'N' ? '아니오' : '미확인'} · ` +
        `이용제한: ${s.limit === 'Y' ? '있음' : s.limit === 'N' ? '없음' : '미확인'} ${esc(s.limitDetail)}` +
        (s.note ? `<br>${esc(s.note)}` : '') +
        ch.map(([id, type, stat, upd, output, power]) =>
          `<div class="charger">충전기 ${esc(id)} · <b>${esc(states[stat] || '알 수 없음')}</b><br>` +
          `${esc(types[String(type).padStart(2, '0')] || type)} · ${esc(output ? output + ' kW' : power || '출력 정보 없음')}<br>` +
          `상태 갱신: ${esc(time(upd))}</div>`).join('');
    }

    function render(fit) {
      layer.clearLayers(); $('list').replaceChildren();
      const q = $('query').value.trim().toLowerCase();
      const onlyWaiting = $('available').checked;
      const matched = [];
      for (const s of stations.values()) {
        if (q && !((s.nm + ' ' + s.addr).toLowerCase().includes(q))) continue;
        const ch = [...s.chargers.values()];
        const waiting = ch.filter(c => c[2] === '2').length;
        if (onlyWaiting && !waiting) continue;
        matched.push({ s, ch, waiting });
      }
      // 브라우저 과부하 방지: 지도 점은 3,000곳, 왼쪽 목록은 300개까지 (검색으로 좁히면 다른 곳도 보임)
      const shown = matched.slice(0, MAX_MARKERS);
      shown.forEach(({ s, ch, waiting }, i) => {
        const color = waiting ? '#168352' : ch.some(c => c[2] === '3') ? '#d68218' : '#707b78';
        // 팝업 내용은 클릭했을 때 만듦 → 다시 그리기가 빠름
        const marker = L.circleMarker([s.lat, s.lng], { radius: 8, color, fillColor: color, fillOpacity: .85 })
          .addTo(layer).bindPopup(() => popupHtml(s, ch, waiting));
        if (i >= MAX_CARDS) return;
        const card = document.createElement('button'); card.className = 'card';
        card.textContent = `${s.nm || '이름 없음'}\n${s.addr}\n충전대기 ${waiting} / ${ch.length}대`;
        card.onclick = () => { map.setView([s.lat, s.lng], 16); marker.openPopup(); };
        $('list').appendChild(card);
      });
      if (fit && shown.length) map.fitBounds(shown.map(x => [x.s.lat, x.s.lng]), { padding: [25, 25], maxZoom: 15 });
      if (!shown.length) $('list').textContent = '표시할 충전소가 없습니다. 검색 조건이나 시군구를 확인하세요.';
      $('message').textContent = (lastTiming ? `⏱ ${lastTiming}\n` : '') +
        `충전기 ${loaded.toLocaleString()} / ${total.toLocaleString()}건 불러옴` +
        (hasMore ? ' · 아직 남아 있어요 → [다음 5,000건]' : ' · 전부 불러왔어요') +
        `\n충전소 ${stations.size.toLocaleString()}곳 중 조건에 맞는 ${matched.length}곳` +
        (matched.length > MAX_MARKERS ? ` (지도엔 ${MAX_MARKERS.toLocaleString()}곳까지만 표시)` : '') +
        (Math.min(matched.length, MAX_MARKERS) > MAX_CARDS ? ` · 왼쪽 목록은 ${MAX_CARDS}개까지 (검색으로 좁혀 보세요)` : '') +
        (skipped ? ` · 좌표 오류 제외 ${skipped}건` : '') +
        (fetchedAt ? ` · 수신 ${new Date(fetchedAt).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul' })}` : '');
    }

    // ---------- 시작 ----------
    if (typeof L === 'undefined') {
      $('message').textContent = '지도 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 새로고침하세요.';
      $('load').disabled = true;
    } else {
      map = L.map('map', { preferCanvas: true }).setView([37.5665, 126.978], 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      layer = L.layerGroup().addTo(map);

      regions.forEach(([v, t]) => $('region').add(new Option(t, v)));
      $('region').value = '11';
      fillGu();
      $('gu').value = '11680'; // 기본: 서울 강남구

      $('load').onclick = () => fetchBatch(true);
      $('more').onclick = () => fetchBatch(false);
      $('region').onchange = () => { fillGu(); fetchBatch(true); };
      $('gu').onchange = () => {
        const custom = $('gu').value === 'custom';
        $('zscode').hidden = !custom;
        if (custom) $('zscode').focus(); else fetchBatch(true);
      };
      $('zscode').onkeydown = e => { if (e.key === 'Enter') fetchBatch(true); };
      $('query').oninput = () => { if (!busy) render(false); };
      $('available').onchange = () => { if (!busy) render(false); };

      fetchBatch(true); // 열자마자 강남구 바로 조회
    }
  </script>
</body>
</html>
